# Local PostgreSQL for development. Production runs on Render.
# Start:  docker compose up -d
# Stop:   docker compose down        (data is kept in the named volume)
# Reset:  docker compose down -v     (deletes all local data)
services:
  db:
    image: postgres:17
    container_name: thunderpeak-db
    environment:
      POSTGRES_USER: thunderpeak
      POSTGRES_PASSWORD: thunderpeak
      POSTGRES_DB: thunderpeak
    ports:
      - "5433:5432"
    volumes:
      - thunderpeak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thunderpeak -d thunderpeak"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thunderpeak-db-data:
